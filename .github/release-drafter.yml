# Maintains one running draft release, updated on every push to main. The
# draft itself is the answer to "is a release ready yet" — it exists,
# visibly, as an unpublished GitHub Release that grows PR by PR; publishing it
# (by closing the milestone — see milestone-release.yml) is the deliberate
# "yes, now" moment.
#
# The template only ever holds the auto-generated PR list. header/footer are
# static config, the same text every time — not a place to hand-write a
# per-release summary, since Release Drafter recomputes and overwrites the
# whole body on every run and would silently discard anything typed into the
# draft directly.
#
# A release-specific introduction is instead added by hand, directly on the
# draft, right before closing the milestone — see RELEASING.md. Publishing
# (milestone-release.yml) only ever changes the draft's tag, target and draft
# flag; it never touches the notes body, so a hand-written intro survives
# publish intact, provided no further PR merges (and therefore no further
# Release Drafter run) happen in between writing it and closing the
# milestone.

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# This is the current documented `categories` schema (condition objects under
# `when`, category `type` for non-rendering behavior), not the older flat
# `labels:`/top-level `exclude-labels:`/top-level `version-resolver:` schema
# release-drafter also still parses without error. Written against the
# schema actually documented for the pinned `@v6` action, not carried over
# from an older example, since a config that parses without complaint is not
# the same as a config that does what it looks like it does.
categories:
  # pre-exclude runs before changelog rendering and version resolution, so a
  # PR labeled this way contributes nothing at all, not even to $CHANGES.
  - type: pre-exclude
    when:
      label: no-release-notes

  # type: version-resolver with no title renders no changelog section; it
  # only feeds $RESOLVED_VERSION. Kept separate from a rendered "Breaking
  # changes" section on purpose: this project has no changelog section for
  # breaking changes to show yet (see the 0.x note below), but a breaking
  # label should still be able to push the suggested version to major once
  # that becomes relevant.
  - type: version-resolver
    semver-increment: major
    when:
      label: breaking

  - title: "New Features"
    semver-increment: minor
    when:
      label: feature

  - title: "Improvements"
    semver-increment: patch
    when:
      label: improvement

  - title: "Bugfixes"
    semver-increment: patch
    when:
      label: bug

  # No `when`: the one changelog category allowed to omit it, so it becomes
  # the bucket for every PR that didn't match feature/improvement/bug above
  # (unlabeled PRs, or ones labeled documentation/dependencies/chore/etc.).
  # Still contributes patch to $RESOLVED_VERSION like everything else here.
  - title: "Miscellaneous"
    semver-increment: patch

change-template: "- $TITLE (#$NUMBER)"
change-title-escapes: '\<*_&'

# $RESOLVED_VERSION is a starting suggestion, not the final word:
# milestone-release.yml always takes the closed milestone's title as the
# actual version rather than trusting this unconditionally. That matters most
# during the 0.x beta phase, where a "breaking" label resolving to a major
# bump (1.0.0) would be premature — the human decides the actual number every
# time; this only gives them something to look at while deciding.

template: |
  ## Changes

  $CHANGES

no-changes-template: "No changes."
