# Maintains one running draft release, updated on every push to main. The
# draft itself is the answer to "is a release ready yet" — it exists,
# visibly, as an unpublished GitHub Release that grows PR by PR; publishing it
# (by closing the milestone — see milestone-release.yml) is the deliberate
# "yes, now" moment.
#
# The template only ever holds the auto-generated PR list. header/footer are
# static config, the same text every time — not a place to hand-write a
# per-release summary, since Release Drafter recomputes and overwrites the
# whole body on every run and would silently discard anything typed into the
# draft directly.
#
# A release-specific introduction is instead written by hand into the
# milestone's own description, not onto the draft — see RELEASING.md.
# milestone-release.yml prepends it to the published notes at publish time,
# reading it straight from the milestone-closed event. Release Drafter has no
# concept of milestones and never touches one, so the description can be
# rewritten any number of times, at any point, with no race against further
# PR merges recomputing this draft's body underneath it.

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# This is the schema release-drafter's pinned major version (@v7, see
# release-drafter.yml the workflow) actually validates: condition objects
# under `when`, category `type` for non-rendering behavior. The older flat
# `labels:`/top-level `exclude-labels:`/top-level `version-resolver:` schema
# belongs to @v6 and was rejected outright by @v6's own validator the one
# time it was tried here — a config that parses as YAML is not the same as a
# config the pinned action version accepts.
categories:
  # pre-exclude runs before changelog rendering and version resolution, so a
  # PR labeled this way contributes nothing at all, not even to $CHANGES.
  - type: pre-exclude
    when:
      label: no-release-notes

  - title: "Breaking Changes"
    semver-increment: major
    when:
      label: breaking

  - title: "New Features"
    semver-increment: minor
    when:
      label: feature

  - title: "Improvements"
    semver-increment: minor
    when:
      label: improvement

  - title: "Bugfixes"
    semver-increment: patch
    when:
      label: bug

  - title: "Documentation"
    semver-increment: patch
    when:
      label: documentation

  # No `when`: the one changelog category allowed to omit it, so it becomes
  # the bucket for every PR that didn't match any category above (unlabeled
  # PRs, or ones labeled dependencies/chore/etc.). Still contributes patch to
  # $RESOLVED_VERSION like everything else here.
  - title: "Miscellaneous"
    semver-increment: patch

change-template: "- $TITLE (#$NUMBER)"
change-title-escapes: '\<*_&'

# $RESOLVED_VERSION is a starting suggestion, not the final word:
# milestone-release.yml always takes the closed milestone's title as the
# actual version rather than trusting this unconditionally. That matters most
# during the 0.x beta phase, where a "breaking" label resolving to a major
# bump (1.0.0) would be premature — the human decides the actual number every
# time; this only gives them something to look at while deciding.

template: |
  ## Changes

  $CHANGES

no-changes-template: "No changes."
