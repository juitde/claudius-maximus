name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # All three, because the tests spawn real processes and the parts that
    # differ — process groups, signal delivery, taskkill, symlinked temp paths
    # — are exactly the parts a single runner would not exercise. The stand-in
    # for claude is a Go program rather than a shell script precisely so that
    # Windows runs these paths instead of skipping them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        # Windows runners default to PowerShell; this step is written in shell.
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The spawn path hands a child to a goroutine that reaps it, so the race
      # detector earns its runtime here.
      - name: Test
        run: go test -race ./...

  crosscompile:
    # Build-tag mistakes in the platform-specific process handling only show up
    # when the other platforms are actually built, which no test run does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build for every supported platform
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null .
          done

  install-script:
    # Runs the checked-out install.sh/install.ps1 against the real latest
    # GitHub release on all three platforms - this is the actual, live
    # install experience documented in the README, not a simulation of it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh and verify the binary works
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/install-test"
          ./install.sh --dir "$dir"
          "$dir/claudius-maximus" version

      - name: Run install.ps1 and verify the binary works
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "install-test"
          ./install.ps1 -Dir $dir
          # pwsh does not turn a native command's non-zero exit code into its
          # own exit code by default, so a crashing/misbuilt binary here would
          # otherwise report as a passing step - check $LASTEXITCODE by hand.
          & "$dir\claudius-maximus.exe" version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "claudius-maximus.exe version exited $LASTEXITCODE"
            exit $LASTEXITCODE
          }
