name: Milestone Release

# A closed milestone is the "this release is ready" signal. Everything else
# here follows from one deliberately narrow rule, chosen over adopting
# laminas/automatic-releases wholesale: main never stops being main. There is
# no branch rotation and no "next line" topology to compute — a release
# either comes from main (the ordinary case) or from a pre-existing
# release/vX.Y branch a human created by hand when a backport actually became
# necessary (see RELEASING.md). This workflow only ever reads that branch; it
# never creates, renames, or switches a default branch.
on:
  milestone:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  actions: write # to explicitly dispatch release.yml, see the step below

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the milestone title as vMAJOR.MINOR.PATCH
        id: version
        run: |
          title="${{ github.event.milestone.title }}"
          if ! [[ "$title" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Milestone title '$title' is not a bare vMAJOR.MINOR.PATCH version; refusing to guess a release from it."
            exit 1
          fi
          echo "version=$title" >> "$GITHUB_OUTPUT"
          echo "line=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine the ref to release from
        id: target
        run: |
          branch="release/v${{ steps.version.outputs.line }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
            echo "from_release_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "from_release_branch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env, not interpolated directly into the script, since
          # this is attacker-influenceable content (anyone who can edit the
          # milestone) — env expansion is subject to normal shell quoting
          # rather than being spliced into the script text itself.
          MILESTONE_DESCRIPTION: ${{ github.event.milestone.description }}
        run: |
          tag="${{ steps.version.outputs.version }}"
          ref="${{ steps.target.outputs.ref }}"

          # Computed fresh here rather than reused from whatever
          # milestone-draft.yml's draft already contains, so this can never
          # double up whatever preview that draft was showing: the
          # milestone's description (read straight from the event, not from
          # the draft body it may or may not already be previewed in) plus
          # the PR list, exactly like milestone-draft.yml computes its own
          # preview — the two just run at different moments (every push vs.
          # this one-time close) and must never disagree.
          prs=$(gh pr list --search "milestone:\"$tag\" is:merged" \
            --json number,title,labels --jq '[.[] | {number, title, labels: [.labels[].name]}]')
          changes=$(echo "$prs" | python3 .github/scripts/render_milestone_notes.py)

          notes_file=$(mktemp)
          if [ -n "$MILESTONE_DESCRIPTION" ]; then
            printf '%s\n\n%s\n' "$MILESTONE_DESCRIPTION" "$changes" > "$notes_file"
          else
            printf '%s\n' "$changes" > "$notes_file"
          fi

          # milestone-draft.yml always creates this milestone's draft under
          # exactly this tag from the moment it first exists - no renaming
          # or guessing needed, unlike when Release Drafter's own
          # $RESOLVED_VERSION guess had to be overridden with the milestone
          # title on publish.
          if gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            echo "Publishing the existing draft as $tag"
            gh release edit "$tag" --target "$ref" --draft=false --notes-file "$notes_file"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists and is not a draft; refusing to touch a published release (tags are permanent, see RELEASING.md)."
            exit 1
          else
            echo "No draft found for $tag (milestone-draft.yml never ran for it - e.g. zero PRs were ever merged to it); using the freshly rendered notes directly."
            gh release create "$tag" --target "$ref" --title "$tag" --notes-file "$notes_file"
          fi
      - name: Trigger the artifact build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release.yml's own release: published trigger does not reliably
          # fire here: publishing above used this same GITHUB_TOKEN, and
          # GitHub's anti-recursion rule suppresses events caused by a
          # workflow's own token - discovered because v0.1.0 actually
          # published with zero artifacts attached. An explicit dispatch
          # request is not an implicit event, so it fires regardless of
          # which token made it. Kept as a separate workflow from
          # publishing (rather than inlined here) because it is also the
          # one a backport release triggers, and a build failure should
          # never be able to un-publish a release that already exists.
          #
          # --ref main, not the tag: workflow_dispatch is only available on
          # whichever version of release.yml already has that trigger, so
          # dispatching against the tag itself would look for that trigger
          # in the tag's own (possibly older) copy of the file. main always
          # has the current version; the tag to actually build is passed
          # explicitly instead.
          gh workflow run release.yml --ref main -f tag="${{ steps.version.outputs.version }}"

      - name: Open a merge-up PR into main, if this came from a release branch
        if: steps.target.outputs.from_release_branch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${{ steps.target.outputs.ref }}"
          tag="${{ steps.version.outputs.version }}"
          merge_up="merge-up/${tag}"

          git fetch origin main "$branch"
          git switch -c "$merge_up" "origin/$branch"
          git push origin "$merge_up"

          # $owner/$repo below are GraphQL's own variable syntax, resolved
          # server-side via the -f arguments; they are not meant to expand as
          # shell variables. Double-quoting this string would make bash try
          # to expand them instead (to nothing, since no such shell variables
          # exist) rather than leaving them for GraphQL to resolve.
          # shellcheck disable=SC2016
          open_titles=$(gh api graphql -f query='
            query($owner:String!,$repo:String!) {
              repository(owner:$owner, name:$repo) {
                milestones(states:OPEN, first:100) { nodes { title } }
              }
            }' -f owner="${{ github.repository_owner }}" -f repo="${{ github.event.repository.name }}" \
            --jq '.data.repository.milestones.nodes[].title')

          next=$(printf '%s\n' "$open_titles" | python3 .github/scripts/next_milestone.py || true)

          pr_args=(--base main --head "$merge_up" --title "Merge up: $tag into main"
            --body "Propagates the $tag backport (branch \`$branch\`) forward into \`main\`. If this PR shows no changes, the fix was already present in \`main\` before the backport — expected when the fix was made forward-first and then cherry-picked onto the release branch, per RELEASING.md.")

          if [ -n "$next" ]; then
            gh pr create "${pr_args[@]}" --milestone "$next"
          else
            gh pr create "${pr_args[@]}"
          fi
