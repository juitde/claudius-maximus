name: Milestone Release

# A closed milestone is the "this release is ready" signal. Everything else
# here follows from one deliberately narrow rule, chosen over adopting
# laminas/automatic-releases wholesale: main never stops being main. There is
# no branch rotation and no "next line" topology to compute — a release
# either comes from main (the ordinary case) or from a pre-existing
# release/vX.Y branch a human created by hand when a backport actually became
# necessary (see RELEASING.md). This workflow only ever reads that branch; it
# never creates, renames, or switches a default branch.
on:
  milestone:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the milestone title as vMAJOR.MINOR.PATCH
        id: version
        run: |
          title="${{ github.event.milestone.title }}"
          if ! [[ "$title" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Milestone title '$title' is not a bare vMAJOR.MINOR.PATCH version; refusing to guess a release from it."
            exit 1
          fi
          echo "version=$title" >> "$GITHUB_OUTPUT"
          echo "line=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine the ref to release from
        id: target
        run: |
          branch="release/v${{ steps.version.outputs.line }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
            echo "from_release_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "from_release_branch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to publish if the draft contains another milestone's PRs
        if: steps.target.outputs.from_release_branch == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release Drafter has no concept of milestones: its one running
          # draft is simply "every PR merged to main since the last
          # published tag", regardless of which milestone any of them were
          # attached to. RELEASING.md's rule — only one milestone targeting
          # main is ever open at a time — is what makes that safe in the
          # ordinary case. This step enforces that rule rather than trusting
          # it: if it were ever violated (a later milestone's PR merged to
          # main while an earlier one is still open), closing the earlier
          # one would publish the later milestone's not-yet-ready PRs under
          # the wrong version, and — because Release Drafter's next
          # comparison baseline becomes this new tag — they would then never
          # appear in the later milestone's own draft either. Caught here,
          # loudly, rather than shipped silently.
          tag="${{ steps.version.outputs.version }}"
          draft_tag=$(gh release list --json isDraft,tagName \
            --jq 'map(select(.isDraft))[0].tagName // empty')
          if [ -z "$draft_tag" ]; then
            echo "No draft exists; nothing to check."
            exit 0
          fi

          # change-template in release-drafter.yml is "- $TITLE (#$NUMBER)",
          # so every entry in the drafted body ends in a PR reference in
          # that exact form — this is our own template, not a guess at
          # someone else's output format.
          pr_numbers=$(gh release view "$draft_tag" --json body --jq '.body' \
            | grep -oE '\(#[0-9]+\)' | tr -d '(#)')

          mismatched=""
          for n in $pr_numbers; do
            pr_milestone=$(gh pr view "$n" --json milestone --jq '.milestone.title // empty')
            if [ -n "$pr_milestone" ] && [ "$pr_milestone" != "$tag" ]; then
              mismatched="$mismatched #$n(milestone:$pr_milestone)"
            fi
          done

          if [ -n "$mismatched" ]; then
            echo "::error::The current draft includes PRs milestoned for a different release, not $tag:$mismatched. Reassign them to $tag if they belong in this release, or hold off closing $tag until that other milestone has shipped first — see RELEASING.md."
            exit 1
          fi

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.version }}"
          ref="${{ steps.target.outputs.ref }}"

          # Found by draft status, not by guessing Release Drafter's own tag
          # name in advance: Release Drafter suggests a version from labels,
          # the milestone is what the human actually decided, and the two are
          # not guaranteed to agree — especially during the 0.x phase, where
          # $RESOLVED_VERSION's major-bump-on-"breaking" default is exactly
          # the kind of guess a human is expected to override (see
          # release-drafter.yml). Matching on draft status and then renaming
          # the tag on publish keeps Release Drafter's accumulated PR notes
          # regardless of which version it originally guessed.
          draft_tag=$(gh release list --json isDraft,tagName \
            --jq 'map(select(.isDraft))[0].tagName // empty')

          if [ -n "$draft_tag" ]; then
            echo "Publishing the existing draft ($draft_tag) as $tag"
            gh release edit "$draft_tag" --tag "$tag" --target "$ref" --draft=false
          else
            echo "No draft found; creating $tag directly with generated notes"
            # origin/$ref, not $ref: checkout only puts the triggering branch
            # (main) into a local branch of that name. A release/vX.Y branch
            # only exists locally as a remote-tracking ref after fetch-depth:
            # 0, so the bare branch name would fail to resolve for git
            # (gh's own --target above is unaffected — it resolves branch
            # names against the API, not the local repo).
            #
            # No trailing ^: at this point ref has not been tagged with the
            # new version yet, so the nearest reachable tag already is the
            # correct "previous release" — walking one commit further back
            # would risk skipping past it.
            prev_tag=$(git describe --tags --abbrev=0 "origin/$ref" 2>/dev/null || echo '')
            if [ -n "$prev_tag" ]; then
              gh release create "$tag" --target "$ref" --title "$tag" --generate-notes --notes-start-tag "$prev_tag"
            else
              gh release create "$tag" --target "$ref" --title "$tag" --generate-notes
            fi
          fi
        # release.yml then fires on this release's "published" event and
        # attaches the GoReleaser artifacts — kept as a separate workflow
        # because it is also the one a backport release triggers.

      - name: Prepend the milestone description to the published notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env, not interpolated directly into the script, since
          # this is attacker-influenceable content (anyone who can edit the
          # milestone) — env expansion is subject to normal shell quoting
          # rather than being spliced into the script text itself.
          MILESTONE_DESCRIPTION: ${{ github.event.milestone.description }}
        run: |
          if [ -z "$MILESTONE_DESCRIPTION" ]; then
            echo "No milestone description set; leaving the generated notes as-is."
            exit 0
          fi
          tag="${{ steps.version.outputs.version }}"
          # The event payload's milestone.description is whatever it was at
          # the moment this milestone was closed — the description can be
          # rewritten any number of times beforehand, including after further
          # PR merges have made Release Drafter recompute the draft body
          # underneath it, with no race: this step runs once, after
          # publishing, and reads the milestone directly rather than
          # anything that could have been overwritten by another workflow
          # run in between. See RELEASING.md.
          current_body=$(gh release view "$tag" --json body --jq '.body')
          notes_file=$(mktemp)
          printf '%s\n\n%s\n' "$MILESTONE_DESCRIPTION" "$current_body" > "$notes_file"
          gh release edit "$tag" --notes-file "$notes_file"

      - name: Open a merge-up PR into main, if this came from a release branch
        if: steps.target.outputs.from_release_branch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${{ steps.target.outputs.ref }}"
          tag="${{ steps.version.outputs.version }}"
          merge_up="merge-up/${tag}"

          git fetch origin main "$branch"
          git switch -c "$merge_up" "origin/$branch"
          git push origin "$merge_up"

          # $owner/$repo below are GraphQL's own variable syntax, resolved
          # server-side via the -f arguments; they are not meant to expand as
          # shell variables. Double-quoting this string would make bash try
          # to expand them instead (to nothing, since no such shell variables
          # exist) rather than leaving them for GraphQL to resolve.
          # shellcheck disable=SC2016
          open_titles=$(gh api graphql -f query='
            query($owner:String!,$repo:String!) {
              repository(owner:$owner, name:$repo) {
                milestones(states:OPEN, first:100) { nodes { title } }
              }
            }' -f owner="${{ github.repository_owner }}" -f repo="${{ github.event.repository.name }}" \
            --jq '.data.repository.milestones.nodes[].title')

          next=$(printf '%s\n' "$open_titles" | python3 .github/scripts/next_milestone.py || true)

          pr_args=(--base main --head "$merge_up" --title "Merge up: $tag into main"
            --body "Propagates the $tag backport (branch \`$branch\`) forward into \`main\`. If this PR shows no changes, the fix was already present in \`main\` before the backport — expected when the fix was made forward-first and then cherry-picked onto the release branch, per RELEASING.md.")

          if [ -n "$next" ]; then
            gh pr create "${pr_args[@]}" --milestone "$next"
          else
            gh pr create "${pr_args[@]}"
          fi
