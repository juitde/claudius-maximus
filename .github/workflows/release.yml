name: Release

# release: published looked like the right trigger for exactly the same
# reason push: tags was rejected: GitHub does not fire new workflow runs for
# events caused by a workflow's own GITHUB_TOKEN, and every tag here is
# created that way. It turns out that anti-recursion rule is not specific to
# push: tags - publishing a release via GITHUB_TOKEN (milestone-release.yml's
# `gh release edit --draft=false`) does not reliably fire release: published
# either, discovered only because v0.1.0 actually published with zero
# artifacts attached. The trigger stays, for the rare case a human publishes
# a release by hand through the web UI (their own auth, not GITHUB_TOKEN,
# so it fires normally) - but the automated path now triggers this
# explicitly instead of relying on it: milestone-release.yml calls
# `gh workflow run release.yml --ref main -f tag=<tag>` right after
# publishing, which (unlike an implicit event) is a direct dispatch request
# and does fire even when made with GITHUB_TOKEN. --ref main, not the tag
# itself: workflow_dispatch is only offered by GitHub for whichever version
# of this file already has that trigger, so it has to be dispatched against
# a ref that does - confirmed the hard way, dispatching against v0.1.0's own
# (pre-fix) copy of this file failed outright ("Workflow does not have
# 'workflow_dispatch' trigger"). The tag to actually build is instead passed
# as an explicit input and checked out by name below, regardless of which
# ref the run was dispatched against.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach artifacts to"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Determine which tag to build
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          echo "tag=${tag:-${{ github.event.release.tag_name }}}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for changelog/tag lookups
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
