name: Release

# release: published looked like the right trigger for exactly the same
# reason push: tags was rejected: GitHub does not fire new workflow runs for
# events caused by a workflow's own GITHUB_TOKEN, and every tag here is
# created that way. It turns out that anti-recursion rule is not specific to
# push: tags - publishing a release via GITHUB_TOKEN (milestone-release.yml's
# `gh release edit --draft=false`) does not reliably fire release: published
# either, discovered only because v0.1.0 actually published with zero
# artifacts attached. The trigger stays, for the rare case a human publishes
# a release by hand through the web UI (their own auth, not GITHUB_TOKEN,
# so it fires normally) - but the automated path now triggers this
# explicitly instead of relying on it: milestone-release.yml calls
# `gh workflow run release.yml --ref <tag>` right after publishing, which
# (unlike an implicit event) is a direct dispatch request and does fire
# even when made with GITHUB_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for changelog/tag lookups

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
